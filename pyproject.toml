[project]
name = "roo-code-test"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Luis Guillermo Echenique", email = "elepistemedev@gmail.com" }
]
dependencies = [
    "pygame>=2.6.1",
    "numpy>=2.2.5",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"] # Configurar src como la raíz del paquete
