[project]
name = "roo-code-test"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Luis Guillermo Echenique", email = "elepistemedev@gmail.com" }
]
dependencies = [
    "pygame>=2.6.1",
    "numpy>=2.2.5",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.12",
    "mkdocs-git-revision-date-localized-plugin>=1.4.5",
    "mkdocs-git-authors-plugin>=0.9.4",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-section-index>=0.3.10",
    "mkdocs-video>=1.5.0",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"] # Configurar src como la raíz del paquete
